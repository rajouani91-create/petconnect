<style>
/* Layout: App-Shell – Seitenleiste (Desktop) / untere Tab-Leiste (Mobil), Inhalt als ruhige Arbeitsfläche */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#e8ede6; --fg:#1b2a24; --muted:#5d6b64; --line:#d5ddd5;
  --brand:#1f5c4d; --brand-soft:#d7e8e1; --accent:#d9783f; --accent-soft:#f8e3d5;
  --ok:#2f7d4f; --ok-soft:#dcefe2; --warn:#a86a07; --warn-soft:#f6ead0; --crit:#b3362f; --crit-soft:#f6dcd9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a17; --surface:#1a2420; --surface-2:#22302a; --fg:#e4ece7; --muted:#9aaaa2; --line:#2f3d37;
  --brand:#6fbfa6; --brand-soft:#1f3a32; --accent:#ef9a63; --accent-soft:#3a2a1f;
  --ok:#6cc58f; --ok-soft:#1d3528; --warn:#e2b04f; --warn-soft:#3a3020; --crit:#ee7d74; --crit-soft:#3d2321; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a17; --surface:#1a2420; --surface-2:#22302a; --fg:#e4ece7; --muted:#9aaaa2; --line:#2f3d37;
  --brand:#6fbfa6; --brand-soft:#1f3a32; --accent:#ef9a63; --accent-soft:#3a2a1f;
  --ok:#6cc58f; --ok-soft:#1d3528; --warn:#e2b04f; --warn-soft:#3a3020; --crit:#ee7d74; --crit-soft:#3d2321; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;letter-spacing:-.01em} h2{font-size:1.2rem} h3{font-size:1rem;font-weight:500}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}

const mobTop = () => `<div class="mob-top"><div class="logo">${document.querySelector('.side .logo svg').outerHTML}PetConnect</div><div class="mob-ctl"><div class="lang"><select data-lang-select id="lang-mob" aria-label="${t('langLabel')}">${langOptions()}</select></div><div class="role" role="group" aria-label="${t('viewLabel')}"><button data-role="owner" aria-pressed="${S.role==='owner'}">${t('roleOwner')}</button><button data-role="vet" aria-pressed="${S.role==='vet'}">${t('rolePractice')}</button></div></div></div>`;
const head = (title,sub,extra='') => `${mobTop()}<div class="head"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${extra}</div>`;
const petTabs = (key,cur) => `<div class="pets" role="group" aria-label="${t('choosePet')}">${Object.entries(S.pets).map(([id,p])=>`<button class="pet-tab" data-pet-${key}="${id}" aria-pressed="${cur===id}">${petAva(p)}${esc(p.name)}</button>`).join('')}</div>`;
const prac = id => S.practices.find(p=>p.id===id);
const remStatus = d => { const n=daysUntil(d); return n<0?['crit',t('overdue',{n:-n})]: n<=14?['warn',n===0?t('today'):t('inDays',{n})]:['ok',t('inDays',{n})]; };
const dateBox = d => `<div class="date-box"><b>${d.getDate()}</b><span>${mon(d)}</span></div>`;
const cardTitle = s => `<h3 style="font-family:var(--f-display);font-weight:700;font-size:1.1rem">${s}</h3>`;

function sparkline(vals,labels){
  const w=320,h=110,pl=34,pr=10,pt=10,pb=22, min=Math.floor(Math.min(...vals)*2)/2-.5, max=Math.ceil(Math.max(...vals)*2)/2+.5;
  const x=i=>pl+i*(w-pl-pr)/(vals.length-1), y=v=>pt+(max-v)*(h-pt-pb)/(max-min);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const ticks=[min,(min+max)/2,max];
  return `<svg class="ltr" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="${t('weightAria')}">
  ${ticks.map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono, monospace">${num(v)}</text>`).join('')}
  <polygon points="${x(0)},${h-pb} ${pts} ${x(vals.length-1)},${h-pb}" fill="var(--brand)" opacity=".12"/>
  <polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="4" fill="var(--accent)"/>
  ${labels.map((l,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${l}</text>`).join('')}</svg>`;
}

  const g=p.gewicht, has2=g.length>=2;
  const diff=has2?(g.at(-1)-g[0]):0;
  const sign = diff>=0?'+':'−';
  return head(t('nav_akte'),t('recSub'), petTabs('akte',S.pet)) + `
  <div class="grid split">
    <div class="card"><div class="card-h"><div style="display:flex;gap:12px;align-items:center;min-width:0">${petAva(p,56,true)}<div><h2>${esc(p.name)}</h2><span class="pill info">${t('passport')}</span></div></div><label class="link" for="akte-photo" tabindex="0">${t('photoChange')}</label><input type="file" id="akte-photo" class="vh" accept="image/*" data-pid="${S.pet}"></div>
      <dl class="kv"><dt>${t('species')}</dt><dd>${t(p.art)}, ${esc(t(p.rasse))}</dd><dt>${t('sex')}</dt><dd>${t(p.sex)}</dd><dt>${t('born')}</dt><dd class="mono">${p.geb?fmt(p.geb):'—'}</dd><dt>${t('chip')}</dt><dd class="mono" dir="ltr" style="text-align:start">${esc(p.chip)}</dd><dt>${t('passNo')}</dt><dd class="mono" dir="ltr" style="text-align:start">${esc(p.pass)}</dd><dt>${t('allergies')}</dt><dd>${t(p.allergien)}</dd></dl></div>
    <div class="card"><div class="card-h"><h2>${t('weight')}</h2><span class="mono">${g.length?num(g.at(-1))+' kg':'—'}</span></div>${has2?sparkline(g,lastMonths(g.length)):`<p class="empty">${t('weightNone')}</p>`}

    <div class="card"><h2>${t('vaccs')}</h2><div class="list">${p.impf.length?p.impf.map(i=>{const [c,l]=remStatus(i.f);return `<div class="row"><div class="grow"><div style="font-weight:600">${esc(t(i.n))}${i.pflicht?` <span class="pill info">${t('travelReq')}</span>`:''}</div><div class="muted mono" style="font-size:.8rem">${t('vaccinated',{d:fmt(i.d),f:fmt(i.f)})}</div></div><span class="pill ${c}">${l}</span></div>`}).join(''):`<p class="empty">${t('noVacc')}</p>`}</div></div>
    <div class="card"><h2>${t('meds')}</h2><div class="list">${p.medi.length?p.medi.map(m=>`<div class="row"><div class="grow"><div style="font-weight:600">${esc(t(m.n))}</div><div class="muted" style="font-size:.85rem">${esc(t(m.dos))}</div></div><span class="pill ok">${t('active')}</span></div>`).join(''):`<p class="empty">${t('noData')}</p>`}</div></div>

    <div class="list">${p.befunde.length?p.befunde.map(b=>`<div class="row" style="align-items:flex-start"><span class="when">${fmt(b.d)}</span><div class="grow"><div style="font-weight:600">${esc(t(b.t))}</div><div class="muted" style="font-size:.9rem">${esc(t(b.x))}</div></div></div>`).join(''):`<p class="empty">${t('noData')}</p>`}</div></div>`;

const SYM = {
  rot:['s_breath','s_seizure','s_poison','s_bloat','s_bleed','s_urine'],
  gelb:['s_vomit','s_diarrhea','s_noeat','s_limp','s_cough','s_itch','s_thirst','s_eyes']
};
function triage(){
  const s=S.sym, c=s.chips;
  if(c.some(x=>SYM.rot.includes(x))||s.ruhig==='apathisch') return {lvl:'crit',t:'rCritT',x:'rCritX',cta:['notfall','findER']};
  if(!c.length) return null;
  const ernst = s.dauer==='>3d' || (s.dauer==='1-3d' && c.length>=2) || (c.includes('s_noeat') && S.pets[s.pet].art==='cat' && s.dauer!=='<24h') || (c.includes('s_vomit')&&c.includes('s_diarrhea'));
  if(ernst) return {lvl:'warn',t:'rWarnT',x:'rWarnX',cta:['termine','bookAppt']};
  return {lvl:'ok',t:'rOkT',x:'rOkX',cta:['tele','startVideo']};
}

  <div class="grid split">

      <span class="label">${t('whichPet')}</span>${petTabs('sym',s.pet)}

      <div class="grid g2"><div class="field"><label class="label" for="dauer">${t('since')}</label><select id="dauer">${opt('<24h',s.dauer,'d1')}${opt('1-3d',s.dauer,'d2')}${opt('>3d',s.dauer,'d3')}</select></div>

    <div style="display:flex;flex-direction:column;gap:12px">
      ${r?`<div class="result ${r.lvl}" aria-live="polite"><span class="label">${t('resultFor',{pet:S.pets[s.pet].name})}</span><h2>${t(r.t)}</h2><p>${t(r.x)}</p><button class="btn${r.lvl==='crit'?' crit':''}" data-go="${r.cta[0]}" style="align-self:flex-start">${t(r.cta[1])}</button></div>`

function validate(fields){
  const f=F(), e={};
  fields.forEach(k=>{ const v=f[k];
    if(k==='email'){ if(!v) e[k]='err_required'; else if(!emailOk(v)) e[k]='err_email'; }
    else if(k==='password'){ if(!v) e[k]='err_required'; }
    else if(k==='newPw'){ if(!f.password) e.password='err_required'; else if(f.password.length<8) e.password='err_pw'; }
    else if(k==='consent'){ if(!v) e[k]='err_consent'; }
    else if(k==='chipNo'){ const d=(v||'').replace(/\s/g,''); if(d && !/^\d{15}$/.test(d)) e[k]='err_chip'; }
    else if(!(v||'').toString().trim()) e[k]='err_required';
  });
  S.auth.errors=e; return !Object.keys(e).length;
}

function slotsFor(dayIdx,p=S.book.p){
  const d=addDays(dayIdx), w=d.getDay(), h=(p==='p1'?S.hours:DEF_HOURS)[w];
  if(!h.open || (p==='p1' && S.blocks.some(b=>sameDay(b.d,d)))) return [];
  const now=nowHM();
  return ALL_SLOTS.filter(x=>x>=h.from && x<h.to).map(x=>{ const i=ALL_SLOTS.indexOf(x);
    const taken=S.appts.some(a=>a.p===p && a.status!=='cancelled' && sameDay(a.d,d) && a.t===x);
    return {t:x, free: ((i*7+dayIdx*3)%5)!==0 && !taken && !(dayIdx===0 && x<=now)}; });
}
function altSlots(ap,n=3){

  for(let i=0;i<21&&out.length<n;i++){ const s=slotsFor(i,'p1').find(s=>s.free && !(sameDay(addDays(i),ap.d)&&s.t===ap.t)); if(s) out.push([i,s.t]); }
  return out;
}

      <div class="card"><h2>${t('vaccs')}</h2><div class="list">${vacc}</div></div>

      <hr class="sep">

function vRecall(){
  const rows=recallRows(), uns=rows.filter(r=>!S.sent.has(r.key));
  const list=rows.map(r=>{const p=getPet(r.id), [c,l]=remStatus(r.v.f), sent=S.sent.has(r.key);

function vAuswertung(){
  const on=[38,52,71,88,104,121], ph=[212,198,181,170,158,149], ms=lastMonths(6);
  const share=v=>on[v]/(on[v]+ph[v])*100;
  const w=640,h=250,pl=40,pr=10,pt=12,pb=28,max=250,gw=(w-pl-pr)/6,bw=gw*0.3;
  const y=v=>pt+(max-v)*(h-pt-pb)/max;
  const grid=[0,50,100,150,200,250].map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">${v}</text>`).join('');
  const bars=ms.map((m,i)=>{const x0=pl+i*gw+gw/2; return `<rect x="${x0-bw-2}" y="${y(on[i])}" width="${bw}" height="${y(0)-y(on[i])}" rx="2" fill="var(--brand)"/><rect x="${x0+2}" y="${y(ph[i])}" width="${bw}" height="${y(0)-y(ph[i])}" rx="2" fill="var(--muted)" opacity=".35"/><text x="${x0}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${m}</text>`}).join('');
  const kpi=(lab,val,sub)=>`<div class="card stat"><span class="label">${lab}</span><b class="mono">${val}</b><span class="muted">${sub}</span></div>`;
  return head(t('nav_vauswertung'),t('anaSub'),`<span class="demo">${t('demo')}</span>`) + `
  <div class="grid g4">${kpi(t('kpiNoShow'),pct(3.1),t('beforeV',{v:pct(9.4)}))}${kpi(t('kpiOnline'),pct(share(5)),t('beforeV',{v:pct(share(0))}))}${kpi(t('kpiCalls'),'≈ 62',t('estimate'))}${kpi(t('kpiRem'),String(214+S.sentN),t('kpiConv',{p:pct(38)}))}</div>
  <div class="card" style="margin-top:16px"><div class="card-h" style="flex-wrap:wrap"><h2>${t('chartTitle')}</h2><div class="legend"><span><i class="lg" style="background:var(--brand)"></i>${t('src_online')}</span><span><i class="lg" style="background:var(--muted);opacity:.35"></i>${t('src_phone')}</span></div></div>
  <svg class="ltr" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="${t('chartTitle')}">${grid}${bars}</svg></div>
  <p class="note" style="margin-top:14px">${t('anaNote')}</p>`;
}

function vetAction(a,d){
  const f=F(), ap=d.id?findAp(d.id):null;
  switch(a){
    case 'bf': S.bfilter=d.v; S.moving=S.cancelling=null; render(); return true;
    case 'goBookings': S.bfilter='pending'; go('vbuchungen'); return true;
    case 'bConfirm': ap.status='confirmed'; celebrate(t('toastConfirmed',{who:apOwner(ap)})); render(); return true;
    case 'bMove': S.moving=S.moving===ap.id?null:ap.id; S.cancelling=null; render(); return true;
    case 'bMoveTo': { const [i,tm]=d.to.split('|'); ap.d=addDays(+i); ap.t=tm; ap.status='confirmed'; S.moving=null; toast(t('toastMoved',{date:`${wd(ap.d)} ${fmt(ap.d)}`,time:tm,who:apOwner(ap)})); render(); return true; }
    case 'bCancel': S.cancelling=ap.id; S.moving=null; render(); return true;
    case 'bCancelYes': ap.status='cancelled'; S.cancelling=null; toast(t('toastCancelled',{who:apOwner(ap)})); render(); return true;
    case 'bCancelNo': S.cancelling=null; render(); return true;
    case 'addBlock':
      if(!validate(['absDate'])){ render(); return true; }
      S.blocks.push({id:Date.now(),d:new Date(f.absDate+'T00:00'),reason:(f.absReason||'').trim()||'—'});
      delete f.absDate; delete f.absReason; toast(t('toastAbsence')); render(); return true;
    case 'rmBlock': S.blocks=S.blocks.filter(b=>String(b.id)!==d.bid); toast(t('toastAbsRemoved')); render(); return true;
    case 'openPat': S.vpat=d.pid; S.auth.errors={}; ['vacName','vacDate','vacYears','finTitle','finText','wKg'].forEach(k=>delete f[k]); render(); window.scrollTo(0,0); return true;
    case 'backPats': S.vpat=null; S.auth.errors={}; render(); return true;
    case 'saveVacc': {
      const p=getPet(d.pid); if(!validate(['vacDate'])){ render(); return true; }
      const dd=new Date(f.vacDate+'T00:00'), fu=new Date(dd); fu.setFullYear(fu.getFullYear()+(+(f.vacYears||1)));
      p.impf.push({n:f.vacName,d:dd,f:fu});
      if(S.pets[d.pid]) S.rem.push({id:Date.now(),pet:d.pid,t:f.vacName,d:fu,k:'kVacc'});
      toast(t('toastVacc',{name:p.name})); render(); return true; }
    case 'saveFinding': {
      const p=getPet(d.pid); if(!validate(['finTitle'])){ render(); return true; }
      p.befunde.push({d:new Date(TODAY),t:f.finTitle.trim(),x:(f.finText||'').trim()});
      delete f.finTitle; delete f.finText; toast(t('toastFinding',{name:p.name})); render(); return true; }
    case 'saveWeight': {
      const p=getPet(d.pid), kg=parseFloat(f.wKg);
      if(isNaN(kg)||kg<=0){ S.auth.errors={wKg:'err_required'}; render(); return true; }
      S.auth.errors={}; p.gewicht.push(kg); delete f.wKg; toast(t('toastWeight',{name:p.name})); render(); return true; }
    case 'sendRem': S.sent.add(d.key); S.sentN++; toast(t('toastSent',{who:ownerOf(d.key.split('|')[0])})); render(); return true;
    case 'sendAll': { const uns=recallRows().filter(r=>!S.sent.has(r.key)); uns.forEach(r=>S.sent.add(r.key)); S.sentN+=uns.length; toast(t('toastSentAll',{n:uns.length})); render(); return true; }
  }
  return false;
}
function vetChange(el){
  const ds=el.dataset||{};
  if(ds.hday!==undefined){ const h=S.hours[+ds.hday]; if(ds.hfield==='open') h.open=el.checked; else if(el.value) h[ds.hfield]=el.value; toast(t('toastHours')); render(); return true; }
  if(ds.tdur!==undefined){ S.types[+ds.tdur].min=+el.value; toast(t('toastType')); return true; }
  if(ds.tonline!==undefined){ S.types[+ds.tonline].online=el.checked; toast(t('toastType')); return true; }
  if(el.id==='autorem'){ S.autoRem=el.checked; toast(t(el.checked?'autoOn':'autoOff')); return true; }
  return false;
}

function shade(hex,f){ const n=parseInt(hex.slice(1),16); const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f)))); return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join(''); }
function tint(hex,f){ const n=parseInt(hex.slice(1),16); const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v+(255-v)*f)); return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join(''); }

function readPhoto(file,cb){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image();
    img.onload=()=>{ const s=256, c=document.createElement('canvas'); c.width=c.height=s; const k=Math.max(s/img.width,s/img.height), w=img.width*k, h=img.height*k; c.getContext('2d').drawImage(img,(s-w)/2,(s-h)/2,w,h); cb(c.toDataURL('image/jpeg',.85)); };
    img.onerror=()=>toast(t('photoErr')); img.src=r.result; };
  r.onerror=()=>toast(t('photoErr')); r.readAsDataURL(file);
}

  if(el.dataset && el.dataset.f){ F()[el.dataset.f]= el.type==='checkbox'?el.checked:el.value; }
  if(vetChange(el)) return;
  if(el.matches('[data-lang-select]')){ LANG=el.value; try{localStorage.setItem('pc-lang',LANG)}catch(err){} render(); return; }
  if(el.name==='prac'){ S.book.p=el.value; render(); }
  if(el.id==='grund'){ S.book.grund=el.value; render(); }
  if(el.id==='art'){ S.book.art=el.value; render(); }
  if(el.id==='dauer'){ S.sym.dauer=el.value; S.sym.res=null; }
  if(el.id==='ruhig'){ S.sym.ruhig=el.value; S.sym.res=null; }
  if(el.dataset.remon){ const r=S.rem.find(x=>x.id==el.dataset.remon); r.off=!el.checked; toast(el.checked?t('pushOn'):t('pushOff')); }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='chatform') return; e.preventDefault();
  const inp=document.getElementById('chatin'), v=inp.value.trim(); if(!v) return;
  const vet=S.role==='vet', hm=new Date().toLocaleTimeString(L(),{hour:'2-digit',minute:'2-digit'});
  S.chat.push({me:!vet,txt:v,when:'today',hm}); render();
  setTimeout(()=>{ S.chat.push({me:vet,k:vet?'autoOwner':'autoVet',when:'today',hm}); if(S.view==='tele') render(); },1400);
  setTimeout(()=>document.getElementById('chatin')?.focus(),0);
});
render();
</script>
